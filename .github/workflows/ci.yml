name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ИСПРАВЛЕНО: "docker compose" вместо "docker-compose" (v1 удалён на ubuntu-latest)
      - name: Build and start docker compose
        run: docker compose up -d --build web selenium-hub chrome

      - name: Wait for web service
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000 && break
            sleep 2
          done
          curl -f http://localhost:5000 || exit 1

      # ИСПРАВЛЕНО: тесты запускаются в контейнере внутри сети compose
      - name: Run tests (parallel, -n auto)
        run: docker compose run --rm tests

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: reports/report.html

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Shutdown docker compose
        if: always()
        run: docker compose down -v
