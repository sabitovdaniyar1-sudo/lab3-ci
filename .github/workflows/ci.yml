
name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start services
        run: docker compose up -d --build web selenium-hub chrome

      - name: Wait for web service
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5000/; then
              echo "Web service is ready"
              exit 0
            fi
            sleep 2
          done

          echo "Web service did not become ready"
          docker compose ps
          docker compose logs web
          exit 1

      - name: Wait for Selenium
        run: |
          for i in $(seq 1 60); do
            if curl -fsS \
              http://localhost:4444/wd/hub/status \
              > /tmp/selenium-status.json; then
              if grep -q '"ready"[[:space:]]*:[[:space:]]*true' \
                /tmp/selenium-status.json; then
                echo "Selenium is ready"
                exit 0
              fi
            fi
            sleep 2
          done

          echo "Selenium did not become ready"
          docker compose logs selenium-hub chrome
          exit 1

      - name: Run tests and generate HTML report
        run: |
          mkdir -p reports
          docker compose run --rm tests

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: reports/report.html
          if-no-files-found: warn

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Shutdown Docker Compose
        if: always()
        run: docker compose down -v
